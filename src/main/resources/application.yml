server:
  port: 9000

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/ruwani425/swiftcart-config-repo.git
          default-label: main
          clone-on-start: true
        native:
          search-locations: ${CONFIG_NATIVE_SEARCH_LOCATION:file:../shared-config,classpath:/config}

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
